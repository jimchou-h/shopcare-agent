services:
  app:
    build:
      context: .
    image: shopcare-agent:local
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      CHAT_MODE: "${CHAT_MODE:-preset}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
